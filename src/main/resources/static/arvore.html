<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Árvore de Decisão — Ao Vivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(160deg, #1a2e1a 0%, #102010 100%);
      min-height: 100vh;
      color: #f5e9c8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(12px, 2.2vw, 20px);
      color: #d4a855;
      text-shadow: 3px 3px 0 #7a5020;
      text-align: center;
      margin-bottom: 0.75rem;
    }

    #jogador {
      font-weight: 800;
      font-size: clamp(14px, 2vw, 20px);
      color: #a8d08a;
      margin-bottom: 0.4rem;
      min-height: 1.5em;
    }

    #stats {
      font-size: clamp(11px, 1.4vw, 14px);
      color: #b8c4a0;
      background: #243c24;
      border: 2px solid #4a6a3a;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
    }

    #fluxograma {
      width: min(92vw, 640px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .no {
      background: #f5e9c8;
      color: #2e1a08;
      border: 4px solid #b8843a;
      border-radius: 8px;
      box-shadow: 5px 5px 0 rgba(0,0,0,0.45);
      padding: 0.9rem 1.3rem;
      max-width: 560px;
      text-align: center;
      font-weight: 600;
      font-size: clamp(13px, 1.8vw, 17px);
      animation: aparece 0.35s ease-out;
    }

    .no.folha {
      background: #3a8c1e;
      color: #f0f8e0;
      border-color: #1e5a0a;
      box-shadow: 0 0 24px rgba(90,174,48,0.65), 5px 5px 0 rgba(0,0,0,0.45);
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(11px, 1.6vw, 14px);
      line-height: 1.8;
    }

    .no.ultimo {
      border-color: #d4a855;
      box-shadow: 0 0 18px rgba(212,168,85,0.7), 5px 5px 0 rgba(0,0,0,0.45);
    }

    .conector {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 58px;
      justify-content: center;
      animation: aparece 0.35s ease-out;
    }

    .rotulo {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 2px;
    }

    .sim  { background: #2e6a12; color: #d8f0c0; }
    .nao  { background: #8b2020; color: #f5d8d8; }

    .linha-vertical {
      width: 4px;
      flex: 1;
      background: #d4a855;
      box-shadow: 0 0 6px rgba(212,168,85,0.5);
    }

    .ponta {
      width: 0; height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #d4a855;
    }

    .vazio {
      font-size: clamp(13px, 1.8vw, 17px);
      line-height: 2;
      text-align: center;
      color: #b8c4a0;
      background: #243c24;
      border: 4px dashed #4a6a3a;
      padding: 2.5rem 2rem;
    }

    .rodape {
      margin-top: 1.5rem;
      font-size: clamp(10px, 1.3vw, 13px);
      color: #8aa07a;
      text-align: center;
      line-height: 1.8;
    }

    @keyframes aparece {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>&#9670; A &Aacute;RVORE EST&Aacute; PENSANDO &#9670;</h1>
  <div id="jogador"></div>
  <div id="stats"></div>
  <div id="fluxograma"><p class="vazio">Conectando ao servidor...</p></div>
  <p class="rodape">Cada caixa &eacute; um <b>n&oacute;</b> da &aacute;rvore bin&aacute;ria.<br>
  SIM desce um galho, N&Atilde;O desce outro. A folha dourada &eacute; o chute da m&aacute;quina.</p>

<script>
  let ultimaAssinatura = '';

  async function atualizar() {
    try {
      const [resArvore, resAtiva] = await Promise.all([
        fetch('/arvore'),
        fetch('/partida/ativa')
      ]);
      const arvore = await resArvore.json();
      const ativa = await resAtiva.json();

      const mapa = {};
      let folhas = 0;
      for (const n of arvore) {
        mapa[n.id] = n;
        if (n.folha) folhas++;
      }

      const assinatura = ativa.jogador + '|' + (ativa.passos || []).length + '|' + arvore.length;
      document.getElementById('stats').textContent =
        `${arvore.length} nós no total • ${folhas} animais • profundidade atual: ${Math.max(0, (ativa.passos || []).length - 1)}`;

      if (assinatura === ultimaAssinatura) return;
      ultimaAssinatura = assinatura;

      const jogador = document.getElementById('jogador');
      const fluxo = document.getElementById('fluxograma');

      if (!ativa.jogador || !(ativa.passos || []).length) {
        jogador.textContent = '';
        fluxo.innerHTML = '<p class="vazio">Aguardando um jogador...<br>Pense em um animal e comece no jogo!</p>';
        return;
      }

      jogador.textContent = `Jogando agora: ${ativa.jogador}`;

      let html = '';
      const passos = ativa.passos;
      for (let i = 0; i < passos.length; i++) {
        const no = mapa[passos[i].noId];
        if (!no) continue;
        if (i > 0) {
          const r = passos[i].resposta === 's' ? 's' : 'n';
          html += `<div class="conector"><span class="rotulo ${r === 's' ? 'sim' : 'nao'}">${r === 's' ? 'SIM' : 'NÃO'}</span><div class="linha-vertical"></div><div class="ponta"></div></div>`;
        }
        const classes = 'no' + (no.folha ? ' folha' : '');
        html += `<div class="${classes}" id="no-${i}">${escapar(no.dado)}</div>`;
      }
      fluxo.innerHTML = html;

      const ultimo = document.getElementById('no-' + (passos.length - 1));
      if (ultimo) ultimo.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (e) {
      document.getElementById('fluxograma').innerHTML =
        '<p class="vazio">Servidor indisponível.<br>Tentando novamente...</p>';
    }
  }

  function escapar(texto) {
    const div = document.createElement('div');
    div.textContent = texto;
    return div.innerHTML;
  }

  atualizar();
  setInterval(atualizar, 3000);
</script>
</body>
</html>
