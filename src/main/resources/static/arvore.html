<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Árvore Binária</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(160deg, #1a2e1a 0%, #102010 100%);
      color: #f5e9c8;
      font-family: 'Segoe UI', 'Nunito', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
      padding: 0.8rem 1.4rem;
      background: rgba(0,0,0,0.35);
      border-bottom: 2px solid #2e4a2e;
      flex-wrap: wrap;
    }

    h1 { font-size: 1.15rem; color: #d4a855; letter-spacing: 2px; }
    #jogador { font-weight: 800; color: #a8d08a; min-height: 1.3em; }
    #stats { font-size: 0.85rem; color: #b8c4a0; }

    #legenda {
      margin-left: auto;
      display: flex;
      gap: 1rem;
      font-size: 0.78rem;
      color: #8aa07a;
    }
    .legenda-item { display: flex; align-items: center; gap: 5px; }
    .bola { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .bola-percorrida { background: #3a8c1e; }
    .bola-atual { background: #d4a855; }
    .bola-futura { background: #4a5a4a; }

    #mapa { flex: 1; position: relative; overflow: hidden; cursor: grab; }
    #mapa:active { cursor: grabbing; }

    #viewport { position: absolute; transform-origin: 0 0; transition: transform 0.4s ease; }

    svg text { user-select: none; }

    .no-futuro { fill: #4a5a4a; stroke: #2e3a2e; stroke-width: 1.5; }
    .no-percorrido { fill: #3a8c1e; stroke: #1e5a0a; stroke-width: 1.5; }
    .no-atual { fill: #d4a855; stroke: #8a6020; stroke-width: 2.5; }

    .aresta { stroke: #3a4a3a; stroke-width: 1.5; fill: none; }
    .aresta.ativa { stroke: #d4a855; stroke-width: 3; }

    .rotulo-aresta { font-size: 11px; fill: #6a7a6a; font-weight: 700; }
    .rotulo-aresta.ativa-sim { fill: #a8d08a; font-size: 13px; }
    .rotulo-aresta.ativa-nao { fill: #e0a0a0; font-size: 13px; }

    .nivel-label { font-size: 11px; fill: #5a6a5a; }

    #no-atual-barra {
      background: rgba(0,0,0,0.4);
      border-top: 2px solid #2e4a2e;
      padding: 0.7rem 1.4rem;
      font-size: 0.95rem;
      min-height: 2.6em;
      color: #f5e9c8;
    }
    #no-atual-barra b { color: #d4a855; }

    .controles {
      position: absolute;
      bottom: 70px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 5;
    }
    .controles button {
      background: #243c24;
      color: #d4a855;
      border: 2px solid #4a6a3a;
      border-radius: 6px;
      width: 38px; height: 34px;
      font-size: 1rem;
      cursor: pointer;
    }
    .controles button:hover { background: #2e4a2e; }

    #carregando {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b8c4a0;
      font-size: 1.1rem;
      z-index: 2;
      background: transparent;
    }
  </style>
</head>
<body>
  <header>
    <h1>&#9670; A &Aacute;RVORE BIN&Aacute;RIA &#9670;</h1>
    <span id="jogador"></span>
    <span id="stats"></span>
    <div id="legenda">
      <span class="legenda-item"><span class="bola bola-percorrida"></span> percorrido</span>
      <span class="legenda-item"><span class="bola bola-atual"></span> n&oacute; atual</span>
      <span class="legenda-item"><span class="bola bola-futura"></span> n&atilde;o explorado</span>
    </div>
  </header>

  <div id="mapa">
    <div id="viewport"></div>
    <div class="controles">
      <button onclick="zoom(1.4)">+</button>
      <button onclick="zoom(0.7)">&minus;</button>
      <button onclick="fit()" title="Ajustar">&#9635;</button>
    </div>
    <div id="carregando">Desenhando a &aacute;rvore...</div>
  </div>

  <div id="no-atual-barra">Aguardando um jogador...</div>

<script>
  let nos = null;
  let caminhoIds = [];
  let escala = 1, panX = 0, panY = 0;
  let ultimaAssinatura = '';
  let posAtuais = null;
  let alturaSvgAtual = 0;
  let ultimoNoCentralizado = null;

  function calcularLayout(mapa, raiz, espacoX, espacoY, raio) {
    let contadorFolhas = 0;
    let alturaMax = 0;
    const pos = {};

    function visitar(id, profundidade) {
      if (profundidade > alturaMax) alturaMax = profundidade;
      const no = mapa[id];
      if (!no) return null;

      if (no.folha) {
        const p = { x: contadorFolhas * espacoX + raio, y: profundidade * espacoY + raio };
        pos[id] = p;
        contadorFolhas++;
        return p;
      }

      const esq = (no.simId && mapa[no.simId]) ? visitar(no.simId, profundidade + 1) : null;
      const dir = (no.naoId && mapa[no.naoId]) ? visitar(no.naoId, profundidade + 1) : null;

      let x;
      if (esq && dir) x = (esq.x + dir.x) / 2;
      else if (esq) x = esq.x;
      else if (dir) x = dir.x;
      else x = contadorFolhas * espacoX;

      const p = { x, y: profundidade * espacoY + raio };
      pos[id] = p;
      return p;
    }

    if (raiz) visitar(raiz.id, 0);
    return { pos, alturaMax };
  }

  function desenhar() {
    const mapaNos = {};
    let raiz = null;
    const filhos = new Set();
    for (const n of nos) {
      mapaNos[n.id] = n;
      if (n.simId) filhos.add(n.simId);
      if (n.naoId) filhos.add(n.naoId);
    }
    for (const n of nos) {
      if (!filhos.has(n.id)) { raiz = n; break; }
    }
    if (!raiz) return;

    const raio = 8, espacoX = 26, espacoY = 78;
    const { pos, alturaMax } = calcularLayout(mapaNos, raiz, espacoX, espacoY, raio);
    posAtuais = pos;
    alturaSvgAtual = (alturaMax + 2) * espacoY + 40;

    const noAtualId = caminhoIds.length ? caminhoIds[caminhoIds.length - 1] : null;
    const arestasAtivas = new Set();
    for (let i = 0; i + 1 < caminhoIds.length; i++) {
      arestasAtivas.add(caminhoIds[i] + '-' + caminhoIds[i + 1]);
    }

    let linhas = '', rotulos = '', circulos = '', niveis = '';
    for (let d = 0; d <= alturaMax; d++) {
      niveis += `<text class="nivel-label" x="2" y="${d * espacoY + raio + 4}">nivel ${d}</text>`;
    }

    for (const n of nos) {
      const p = pos[n.id];
      if (!p) continue;

      if (n.simId && pos[n.simId]) {
        const f = pos[n.simId];
        const ativa = arestasAtivas.has(n.id + '-' + n.simId);
        linhas += `<line class="aresta${ativa ? ' ativa' : ''}" x1="${p.x}" y1="${p.y + raio}" x2="${f.x}" y2="${f.y - raio}"/>`;
        rotulos += `<text class="rotulo-aresta${ativa ? ' ativa-sim' : ''}" x="${(p.x + f.x) / 2 + 5}" y="${(p.y + f.y) / 2}">S</text>`;
      }
      if (n.naoId && pos[n.naoId]) {
        const f = pos[n.naoId];
        const ativa = arestasAtivas.has(n.id + '-' + n.naoId);
        linhas += `<line class="aresta${ativa ? ' ativa' : ''}" x1="${p.x}" y1="${p.y + raio}" x2="${f.x}" y2="${f.y - raio}"/>`;
        rotulos += `<text class="rotulo-aresta${ativa ? ' ativa-nao' : ''}" x="${(p.x + f.x) / 2 + 5}" y="${(p.y + f.y) / 2}">N</text>`;
      }
    }

    for (const n of nos) {
      const p = pos[n.id];
      if (!p) continue;
      let classe = 'no-futuro';
      if (n.id === noAtualId) classe = 'no-atual';
      else if (caminhoIds.includes(n.id)) classe = 'no-percorrido';
      circulos += `<circle class="${classe}" cx="${p.x}" cy="${p.y}" r="${raio}"><title>${escapar(n.dado)}</title></circle>`;
    }

    const largura = (nos.filter(n => n.folha).length + 2) * espacoX + 60;
    const alturaSvg = (alturaMax + 2) * espacoY + 40;
    const svg = `<svg width="${largura}" height="${alturaSvg}" xmlns="http://www.w3.org/2000/svg">${linhas}${rotulos}${niveis}${circulos}</svg>`;
    document.getElementById('viewport').innerHTML = svg;

    const barra = document.getElementById('no-atual-barra');
    if (noAtualId && mapaNos[noAtualId]) {
      const no = mapaNos[noAtualId];
      const tipo = no.folha ? 'folha (chute da m&aacute;quina)' : 'n&oacute; de decis&atilde;o';
      barra.innerHTML = `N&oacute; atual: <b>${escapar(no.dado)}</b> &bull; ${tipo} &bull; n&oacute;s percorridos: ${Math.max(0, caminhoIds.length - 1)}`;
    } else {
      barra.innerHTML = 'Aguardando um jogador... a &aacute;rvore inteira est&aacute; vis&iacute;vel: cada galho &eacute; um caminho poss&iacute;vel.';
    }
  }

  function centralizarNoAtual() {
    if (!caminhoIds.length || !posAtuais) return;
    const noId = caminhoIds[caminhoIds.length - 1];
    if (noId === ultimoNoCentralizado) return;
    const p = posAtuais[noId];
    if (!p) return;
    ultimoNoCentralizado = noId;
    const svg = viewport.querySelector('svg');
    if (!svg) return;
    const larguraSvg = parseFloat(svg.getAttribute('width'));
    escala = Math.max(0.3, Math.min(1.5, mapa.clientHeight / alturaSvgAtual));
    panX = Math.max(mapa.clientWidth - larguraSvg * escala, Math.min(0, mapa.clientWidth / 2 - p.x * escala));
    panY = Math.max(mapa.clientHeight - alturaSvgAtual * escala, Math.min(0, mapa.clientHeight / 2 - p.y * escala));
    aplicarTransform();
  }

  function escapar(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
  }

  const mapa = document.getElementById('mapa');
  const viewport = document.getElementById('viewport');

  function aplicarTransform() {
    viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${escala})`;
  }

  function zoom(fator) {
    escala = Math.min(4, Math.max(0.1, escala * fator));
    aplicarTransform();
  }

  function fit() {
    const svg = viewport.querySelector('svg');
    if (!svg || !nos) return;
    escala = Math.min(
      mapa.clientWidth / parseFloat(svg.getAttribute('width')),
      mapa.clientHeight / svg.getAttribute('height'),
      1.2
    );
    escala = Math.max(escala, 0.1);
    panX = 0;
    panY = 0;
    aplicarTransform();
  }

  let arrastando = null;
  mapa.addEventListener('mousedown', e => {
    arrastando = { x: e.clientX, y: e.clientY, panX, panY };
  });
  window.addEventListener('mousemove', e => {
    if (!arrastando) return;
    panX = arrastando.panX + (e.clientX - arrastando.x);
    panY = arrastando.panY + (e.clientY - arrastando.y);
    aplicarTransform();
  });
  window.addEventListener('mouseup', () => { arrastando = null; });
  mapa.addEventListener('wheel', e => {
    e.preventDefault();
    zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });

  async function atualizar() {
    try {
      const [listaNos, ativa] = await Promise.all([
        fetch('/arvore').then(r => r.json()),
        fetch('/partida/ativa').then(r => r.json())
      ]);
      nos = listaNos;
      caminhoIds = (ativa.passos || []).map(p => p.noId);

      document.getElementById('jogador').textContent =
        ativa.jogador ? `Jogando agora: ${ativa.jogador}` : '';
      document.getElementById('stats').textContent =
        `${nos.length} nós • ${nos.filter(n => n.folha).length} animais • profundidade: ${Math.max(0, caminhoIds.length - 1)}`;

      desenhar();
      centralizarNoAtual();
      document.getElementById('carregando').style.display = 'none';
    } catch (e) {
      document.getElementById('no-atual-barra').textContent = 'Servidor indisponível. Tentando novamente...';
    }
  }

  atualizar();
  setInterval(atualizar, 3000);
</script>
</body>
</html>
