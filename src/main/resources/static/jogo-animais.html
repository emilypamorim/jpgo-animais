<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo dos Animais</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('fundo.png') center center / cover no-repeat;
      z-index: 0;
    }

    /* ── PERGAMINHO (todas as telas) ── */
    .card-pergaminho {
      position: relative;
      z-index: 1;
      max-width: 600px;
      min-width: 600px;
      width: 100%;
      text-align: center;
    }

    .pergaminho-corpo {
      background: #f5e9c8;
      border: 4px solid #b8843a;
      border-radius: 4px;
      padding: 3rem 3rem 2.5rem;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      box-shadow:
        0 0 0 2px #7a5020,
        6px 6px 0 #7a5020,
        inset 0 0 0 2px #d4a855;
    }

    .pergaminho-corpo::before,
    .pergaminho-corpo::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      border: 3px solid #7a5020;
      background: #f5e9c8;
    }
    .pergaminho-corpo::before { top: -3px; left: -3px; border-right: none; border-bottom: none; }
    .pergaminho-corpo::after  { bottom: -3px; right: -3px; border-left: none; border-top: none; }

    .canto { position: absolute; width: 20px; height: 20px; border: 3px solid #7a5020; background: #f5e9c8; }
    .canto-tr { top: -3px; right: -3px; border-left: none; border-bottom: none; }
    .canto-bl { bottom: -3px; left: -3px; border-right: none; border-top: none; }

    .trepadeira { position: absolute; width: 48px; height: 48px; pointer-events: none; }
    .trepadeira-tl { top: -12px; left: -12px; }
    .trepadeira-tr { top: -12px; right: -12px; transform: scaleX(-1); }
    .trepadeira-bl { bottom: -12px; left: -12px; transform: scaleY(-1); }
    .trepadeira-br { bottom: -12px; right: -12px; transform: scale(-1); }

    .deco-cogumelo { position: absolute; bottom: -18px; left: -16px; width: 36px; height: 36px; z-index: 2; }

    /* ── TIPOGRAFIA PERGAMINHO ── */
    .pergaminho-eyebrow {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: #8a6020;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .pergaminho-titulo {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: #2e4a1e;
      line-height: 1.8;
      margin: 0.5rem 0;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.12);
    }

    .pergaminho-titulo-md {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #2e4a1e;
      line-height: 2;
      margin: 0.5rem 0 1.25rem;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.12);
    }

    .pergaminho-divisor {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0.75rem 0;
      color: #b8843a;
    }
    .pergaminho-divisor::before,
    .pergaminho-divisor::after {
      content: '';
      flex: 1;
      height: 2px;
      background: repeating-linear-gradient(90deg, #b8843a 0, #b8843a 4px, transparent 4px, transparent 8px);
    }

    .pergaminho-sub {
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      color: #5a4010;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .pergaminho-label {
      display: block;
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: #8a6020;
      letter-spacing: 1px;
      text-align: left;
      margin-bottom: 6px;
    }

    /* ── BOTÃO PIXEL VERDE ── */
    .btn-pixel {
      display: inline-block;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #f0f8e0;
      background: #3a8c1e;
      border: none;
      cursor: pointer;
      padding: 14px 32px;
      width: 100%;
      letter-spacing: 2px;
      box-shadow:
        0 6px 0 #1e5a0a,
        inset 0 2px 0 rgba(255,255,255,0.25),
        3px 0 0 #2d6e14,
        -1px 0 0 #1e5a0a;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .btn-pixel:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1e5a0a, inset 0 2px 0 rgba(255,255,255,0.25), 3px 0 0 #2d6e14, -1px 0 0 #1e5a0a;
    }
    .btn-pixel .star { color: #ffd700; margin: 0 10px; }

    /* ── BOTÕES SIM / NAO ── */
    .btn-row { display: flex; gap: 14px; margin-top: 4px; }

    .btn-pixel-sim, .btn-pixel-nao, .btn-pixel-sec {
      flex: 1;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      border: none;
      cursor: pointer;
      padding: 14px 10px;
      letter-spacing: 1px;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .btn-pixel-sim {
      background: #3a8c1e;
      color: #f0f8e0;
      box-shadow: 0 5px 0 #1e5a0a, inset 0 2px 0 rgba(255,255,255,0.2), 3px 0 0 #2d6e14;
    }
    .btn-pixel-sim:active { transform: translateY(3px); box-shadow: 0 2px 0 #1e5a0a, inset 0 2px 0 rgba(255,255,255,0.2), 3px 0 0 #2d6e14; }

    .btn-pixel-nao {
      background: #c96a3a;
      color: #fdf0e8;
      box-shadow: 0 5px 0 #8a3a1a, inset 0 2px 0 rgba(255,255,255,0.2), 3px 0 0 #a85530;
    }
    .btn-pixel-nao:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a3a1a, inset 0 2px 0 rgba(255,255,255,0.2), 3px 0 0 #a85530; }

    .btn-pixel-sec {
      background: #8a6020;
      color: #f5e9c8;
      box-shadow: 0 5px 0 #5a3a10, inset 0 2px 0 rgba(255,255,255,0.15), 3px 0 0 #704e18;
      width: 100%;
      margin-top: 10px;
    }
    .btn-pixel-sec:active { transform: translateY(3px); box-shadow: 0 2px 0 #5a3a10, inset 0 2px 0 rgba(255,255,255,0.15), 3px 0 0 #704e18; }

    /* ── CAMPOS ── */
    .campo {
      width: 100%;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      color: #2e1a08;
      background: #fffaec;
      border: none;
      padding: 10px 12px;
      margin-bottom: 14px;
      outline: none;
      box-shadow: inset 3px 3px 0 #b8843a, inset -2px -2px 0 #d4a855;
    }
    .campo:focus { background: #fffdf5; }
    .campo::placeholder { color: #b8a070; }

    /* ── RADIO PIXEL ── */
    .radio-row { display: flex; gap: 12px; margin-bottom: 16px; }
    .radio-op {
      flex: 1;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 12px 6px;
      text-align: center;
      color: #8a6020;
      background: #fffaec;
      cursor: pointer;
      box-shadow: inset 3px 3px 0 #b8843a, inset -2px -2px 0 #d4a855;
    }
    .radio-op.selecionado {
      background: #3a8c1e;
      color: #f0f8e0;
      box-shadow: inset 3px 3px 0 #1e5a0a, inset -2px -2px 0 #5aae30;
    }

    /* ── ERRO ── */
    .erro {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: #8b2020;
      background: #ffd0d0;
      padding: 10px;
      margin-bottom: 14px;
      line-height: 2;
      text-align: left;
      box-shadow: inset 2px 2px 0 #c06060;
      display: none;
    }

    /* ── ANIMAL DESTAQUE ── */
    .animal-destaque {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      color: #2e4a1e;
      margin: 0.5rem 0 1.5rem;
      line-height: 1.6;
      text-shadow: 2px 2px 0 #1e5a0a;
    }

    .coelho { display: block; margin: 0 auto 0.5rem; }
  </style>
</head>
<body>

<!-- SVG TREPADEIRA (reutilizado) -->
<svg style="display:none">
  <symbol id="trepadeira" viewBox="0 0 48 48">
    <path d="M4 44 Q4 20 24 4" stroke="#5a8c2a" stroke-width="3" fill="none" stroke-linecap="round"/>

    <ellipse cx="18" cy="18" rx="14" ry="10" fill="#cc2020"/>
    <circle cx="11" cy="14" r="3" fill="#fff" opacity=".8"/>
    <circle cx="20" cy="10" r="3" fill="#fff" opacity=".8"/>

    <ellipse cx="48" cy="30" rx="6" ry="14" fill="#e8dfc8"/>

    <ellipse cx="48" cy="28" rx="3" ry="10" fill="#d4a0a0"/>
    <ellipse cx="40" cy="50" rx="13" ry="10" fill="#f0e8d4"/>
    <circle cx="36" cy="46" r="2" fill="#2e4a38"/>
    <circle cx="44" cy="46" r="2" fill="#2e4a38"/>
    <ellipse cx="40" cy="50" rx="3" ry="2" fill="#d4a0a0"/>
    <line x1="34" y1="51" x2="25" y2="50" stroke="#b0a090" stroke-width="1"/>
    <line x1="34" y1="52" x2="25" y2="53" stroke="#b0a090" stroke-width="1"/>
    <line x1="46" y1="51" x2="55" y2="50" stroke="#b0a090" stroke-width="1"/>
    <line x1="46" y1="52" x2="55" y2="53" stroke="#b0a090" stroke-width="1"/>
    <ellipse cx="28" cy="62" rx="7" ry="4" fill="#d4c8a8"/>
    <ellipse cx="52" cy="62" rx="7" ry="4" fill="#d4c8a8"/>

</svg>

<!-- ══════════ TELA INICIAL ══════════ -->
<div class="card-pergaminho" id="wrap-inicial">
  <div class="pergaminho-corpo">
    <span class="canto canto-tr"></span><span class="canto canto-bl"></span>
    <svg class="trepadeira trepadeira-tl"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-tr"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-bl"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-br"><use href="#trepadeira"/></svg>
    <svg class="deco-cogumelo"><use href="#cogumelo"/></svg>
    <svg class="coelho" width="56" height="56"><use href="#coelho"/></svg>
    <div class="pergaminho-titulo">PENSE EM UM ANIMAL</div>
    <div class="pergaminho-divisor">&#9670;</div>
    <p class="pergaminho-sub">Quando estiver pronto, comece e responderei apenas com sim ou nao.</p>
    <label class="pergaminho-label" style="text-align:left">Seu apelido</label>
    <input class="campo" id="apelido" type="text" maxlength="20" placeholder="Ex: Ana" style="text-align:left">
    <div class="erro" id="erro-iniciar"></div>
    <button class="btn-pixel" onclick="iniciarPartida()" style="margin-top:1.25rem"><span class="star">+</span> COMECAR <span class="star">+</span></button>
  </div>
</div>

<!-- ══════════ TELA PERGUNTA ══════════ -->
<div class="card-pergaminho" id="wrap-pergunta" style="display:none">
  <div class="pergaminho-corpo">
    <span class="canto canto-tr"></span><span class="canto canto-bl"></span>
    <svg class="trepadeira trepadeira-tl"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-tr"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-bl"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-br"><use href="#trepadeira"/></svg>
    <div class="pergaminho-eyebrow">pergunta</div>
    <div id="boas-vindas" style="display:none;font-size:0.85rem;color:#2e4a1e;font-weight:700;margin-bottom:0.75rem"></div>
    <div class="pergaminho-titulo-md" id="texto-pergunta"></div>
    <div class="pergaminho-divisor">&#9670;</div>
    <div class="btn-row" style="margin-top:1.25rem">
      <button class="btn-pixel-sim" onclick="responder('s')">SIM</button>
      <button class="btn-pixel-nao" onclick="responder('n')">NAO</button>
    </div>
  </div>
</div>

<!-- ══════════ TELA ADIVINHACAO ══════════ -->
<div class="card-pergaminho" id="wrap-adivinhacao" style="display:none">
  <div class="pergaminho-corpo">
    <span class="canto canto-tr"></span><span class="canto canto-bl"></span>
    <svg class="trepadeira trepadeira-tl"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-tr"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-bl"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-br"><use href="#trepadeira"/></svg>
    <div class="pergaminho-eyebrow">meu palpite</div>
    <div class="animal-destaque" id="texto-animal"></div>
    <p class="pergaminho-sub">Acertei?</p>
    <div class="btn-row">
      <button class="btn-pixel-sim" onclick="acertou()">SIM!</button>
      <button class="btn-pixel-nao" onclick="mostrarAprender()">NAO</button>
    </div>
  </div>
</div>

<!-- ══════════ TELA APRENDER ══════════ -->
<div class="card-pergaminho" id="wrap-aprender" style="display:none">
  <div class="pergaminho-corpo" style="text-align:left">
    <span class="canto canto-tr"></span><span class="canto canto-bl"></span>
    <svg class="trepadeira trepadeira-tl"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-tr"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-bl"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-br"><use href="#trepadeira"/></svg>
    <div class="pergaminho-eyebrow" style="text-align:center">vou aprender</div>
    <div class="pergaminho-titulo-md" style="text-align:center;margin-bottom:1.25rem">Em que animal voce pensou?</div>
    <div class="erro" id="erro-aprender">Preencha todos os campos.</div>
    <label class="pergaminho-label">Animal que voce pensou</label>
    <input class="campo" id="novo-animal" type="text" placeholder="Ex: Papagaio">
    <label class="pergaminho-label">Pergunta que diferencia dos outros</label>
    <input class="campo" id="nova-pergunta" type="text" placeholder="Ex: Tem penas?">
    <label class="pergaminho-label" style="margin-bottom:8px">Para esse animal a resposta seria...</label>
    <div class="radio-row">
      <div class="radio-op" id="op-sim" onclick="selecionarResposta('s')">SIM</div>
      <div class="radio-op" id="op-nao" onclick="selecionarResposta('n')">NAO</div>
    </div>
    <button class="btn-pixel" onclick="enviarAprender()"><span class="star">+</span> ENSINAR <span class="star">+</span></button>
    <button class="btn-pixel-sec" onclick="mostrarTela('wrap-inicial')">CANCELAR</button>
  </div>
</div>

<!-- ══════════ TELA ACERTOU ══════════ -->
<div class="card-pergaminho" id="wrap-acertou" style="display:none">
  <div class="pergaminho-corpo">
    <span class="canto canto-tr"></span><span class="canto canto-bl"></span>
    <svg class="trepadeira trepadeira-tl"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-tr"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-bl"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-br"><use href="#trepadeira"/></svg>
    <svg class="coelho" width="56" height="56"><use href="#coelho"/></svg>
    <div class="pergaminho-titulo">SABIA QUE ERA!</div>
    <div class="pergaminho-divisor">&#9670;</div>
    <div class="animal-destaque" id="seus-pontos" style="display:none"></div>
    <div class="pergaminho-eyebrow" style="margin-top:1rem">ranking</div>
    <div id="ranking-final" style="text-align:left;font-size:0.95rem;line-height:1.7;margin:0.5rem 0 1rem"></div>
    <p class="pergaminho-sub">Quer tentar de novo?</p>
    <button class="btn-pixel" onclick="mostrarTela('wrap-inicial')"><span class="star">+</span> DE NOVO <span class="star">+</span></button>
  </div>
</div>

<!-- ══════════ TELA APRENDEU ══════════ -->
<div class="card-pergaminho" id="wrap-aprendeu" style="display:none">
  <div class="pergaminho-corpo">
    <span class="canto canto-tr"></span><span class="canto canto-bl"></span>
    <svg class="trepadeira trepadeira-tl"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-tr"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-bl"><use href="#trepadeira"/></svg>
    <svg class="trepadeira trepadeira-br"><use href="#trepadeira"/></svg>
    <div class="pergaminho-titulo" style="margin-bottom:0.5rem">ANOTADO!</div>
    <div class="pergaminho-divisor">&#9670;</div>
    <p class="pergaminho-sub">Da proxima vez vou lembrar.</p>
    <button class="btn-pixel" onclick="mostrarTela('wrap-inicial')"><span class="star">+</span> JOGAR DE NOVO <span class="star">+</span></button>
  </div>
</div>

<script>
  const API = '';
  let partidaId = null;
  let respostaAprender = null;
  let pontosAtual = null;
  let apelidoAtual = null;
  let caminho = [];

  const telas = ['wrap-inicial','wrap-pergunta','wrap-adivinhacao','wrap-aprender','wrap-acertou','wrap-aprendeu'];

  function mostrarTela(id) {
    telas.forEach(t => document.getElementById(t).style.display = 'none');
    document.getElementById(id).style.display = 'block';
  }

  async function iniciarPartida() {
    const erroEl = document.getElementById('erro-iniciar');
    const bruto = document.getElementById('apelido').value;
    if (!bruto.trim()) {
      erroEl.textContent = 'Digite seu apelido para jogar.';
      erroEl.style.display = 'block';
      return;
    }
    erroEl.style.display = 'none';
    apelidoAtual = bruto.trim().toLowerCase();

    const res = await fetch(`${API}/partida`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jogador: apelidoAtual })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      erroEl.textContent = data.erro || 'Erro ao iniciar partida.';
      erroEl.style.display = 'block';
      return;
    }
    const data = await res.json();
    partidaId = data.partidaId;
    pontosAtual = null;
    caminho = [];
    const bv = document.getElementById('boas-vindas');
    if (data.jogadorRecorrente) {
      bv.textContent = `Bem-vindo de volta, ${apelidoAtual}! Você já tem ${data.pontosAcumulados} pts`;
      bv.style.display = 'block';
    } else {
      bv.style.display = 'none';
    }
    if (data.tipo === 'pergunta') {
      document.getElementById('texto-pergunta').textContent = data.conteudo;
      mostrarTela('wrap-pergunta');
    } else {
      document.getElementById('texto-animal').textContent = data.conteudo;
      pontosAtual = data.pontos;
      mostrarTela('wrap-adivinhacao');
    }
  }

  async function responder(resp) {
    const perguntaAtual = document.getElementById('texto-pergunta').textContent;
    const res = await fetch(`${API}/partida/${partidaId}/resposta`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resposta: resp })
    });
    const data = await res.json();
    if (!res.ok) return;
    caminho.push({ pergunta: perguntaAtual, resposta: resp });
    if (data.tipo === 'pergunta') {
      document.getElementById('texto-pergunta').textContent = data.conteudo;
      mostrarTela('wrap-pergunta');
    } else {
      document.getElementById('texto-animal').textContent = data.conteudo;
      pontosAtual = data.pontos;
      mostrarTela('wrap-adivinhacao');
    }
  }

  async function carregarRanking(containerId, destaque) {
    const container = document.getElementById(containerId);
    try {
      const res = await fetch(`${API}/ranking`);
      const lista = await res.json();
      if (!lista.length) {
        container.innerHTML = '<p class="pergaminho-sub" style="text-align:center">Ninguem pontuou ainda.</p>';
        return;
      }
      container.innerHTML = '<ol style="padding-left:1.25rem;margin:0">'
        + lista.map((r, i) =>
          `<li style="${destaque && r.jogador === destaque ? 'font-weight:700;color:#7a5020' : ''}">${r.jogador}: ${r.pontos} pts</li>`
        ).join('')
        + '</ol>';
    } catch (e) {
      container.innerHTML = '<p class="pergaminho-sub" style="text-align:center">Ranking indisponivel.</p>';
    }
  }

  function acertou() {
    const el = document.getElementById('seus-pontos');
    if (pontosAtual !== null && pontosAtual !== undefined) {
      el.textContent = `Seus pontos: ${pontosAtual} (${caminho.length} no${caminho.length > 1 ? 's' : ''} percorridos${caminho.length > 1 ? '' : ' \u2014 pura sorte!'})`;
      el.style.display = 'block';
    } else {
      el.style.display = 'none';
    }
    fetch(`${API}/partida/${partidaId}/confirmar`, { method: 'POST' }).catch(() => {});
    carregarRanking('ranking-final', apelidoAtual);
    mostrarTela('wrap-acertou');
  }

  function mostrarAprender() {
    respostaAprender = null;
    document.getElementById('novo-animal').value = '';
    document.getElementById('nova-pergunta').value = '';
    document.getElementById('op-sim').classList.remove('selecionado');
    document.getElementById('op-nao').classList.remove('selecionado');
    document.getElementById('erro-aprender').style.display = 'none';
    mostrarTela('wrap-aprender');
  }

  function selecionarResposta(r) {
    respostaAprender = r;
    document.getElementById('op-sim').classList.toggle('selecionado', r === 's');
    document.getElementById('op-nao').classList.toggle('selecionado', r === 'n');
  }

async function enviarAprender() {
  const animal = document.getElementById('novo-animal').value.trim();
  const pergunta = document.getElementById('nova-pergunta').value.trim();
  const erroEl = document.getElementById('erro-aprender');
  if (!animal || !pergunta || !respostaAprender) { erroEl.style.display = 'block'; erroEl.textContent = 'Preencha todos os campos.'; return; }
  erroEl.style.display = 'none';

  const res = await fetch(`${API}/partida/${partidaId}/aprender`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ novoAnimal: animal, novaPergunta: pergunta, respostaParaNovo: respostaAprender })
  });

  if (!res.ok) {
    const data = await res.json();
    erroEl.textContent = data.erro || 'Erro ao salvar.';
    erroEl.style.display = 'block';
    return;
  }

  mostrarTela('wrap-aprendeu');
}
</script>
</body>
