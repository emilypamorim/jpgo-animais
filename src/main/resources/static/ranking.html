<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking | Jogo dos Animais</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      background: #1a2e1a;
      color: #f5e9c8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(16px, 3vw, 28px);
      color: #d4a855;
      text-shadow: 3px 3px 0 #7a5020;
      margin-bottom: 2rem;
      text-align: center;
    }

    #ranking { width: 100%; max-width: 700px; }

    .linha {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      background: #f5e9c8;
      color: #2e1a08;
      border: 4px solid #b8843a;
      padding: 1.1rem 1.5rem;
      margin-bottom: 0.9rem;
      box-shadow: 5px 5px 0 #0e1a0e;
      font-size: clamp(11px, 1.8vw, 18px);
    }

    .linha .pos { color: #7a5020; min-width: 2.5em; }
    .linha .nome { flex: 1; word-break: break-all; }
    .linha .pts { font-size: clamp(10px, 1.6vw, 16px); color: #2e4a1e; }

    .linha.primeiro { background: #ffe9a8; border-color: #d4a855; }
    .linha.meu { outline: 4px solid #3a8c1e; }

    .vazio {
      font-size: clamp(11px, 2vw, 16px);
      line-height: 2;
      text-align: center;
      color: #b8c4a0;
      background: #243c24;
      border: 4px dashed #4a6a3a;
      padding: 2.5rem 2rem;
    }

    .regras {
      margin-top: 1.6rem;
      font-size: clamp(9px, 1.2vw, 13px);
      color: #8aa07a;
      text-align: center;
      line-height: 1.8;
    }

    .regras-cards {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.6rem;
      width: 100%;
      max-width: 700px;
    }

    .regra-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: #243c24;
      border: 3px solid #4a6a3a;
      border-radius: 6px;
      padding: 0.8rem 0.6rem;
      text-align: center;
    }

    .regra-card-nome {
      font-size: clamp(9px, 1.1vw, 12px);
      color: #b8c4a0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .regra-card-valor {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(11px, 1.6vw, 15px);
      color: #d4a855;
    }

    .regra-card-valor.verde { color: #a8d08a; }

    .regra-card-sub {
      font-size: clamp(8px, 1vw, 11px);
      color: #6a7a6a;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>&#9670; RANKING &#9670;</h1>

  <div class="regras-cards">
    <div class="regra-card">
      <span class="regra-card-nome">acerto</span>
      <span class="regra-card-valor">ate 14</span>
      <span class="regra-card-sub">a maquina descobriu seu animal (15 - perguntas)</span>
    </div>
    <div class="regra-card">
      <span class="regra-card-nome">engano + ensinar</span>
      <span class="regra-card-valor verde">+7</span>
      <span class="regra-card-sub">ensine um animal novo</span>
    </div>
    <div class="regra-card">
      <span class="regra-card-nome">jogue de novo</span>
      <span class="regra-card-valor">soma</span>
      <span class="regra-card-sub">o placar acumula suas partidas</span>
    </div>
  </div>

  <div id="ranking"><p class="vazio">Carregando...</p></div>

  <script>
    const API = '';

    async function atualizar() {
      const container = document.getElementById('ranking');
      try {
        const res = await fetch(`${API}/ranking`);
        const lista = await res.json();
        if (!lista.length) {
          container.innerHTML = '<p class="vazio">Ninguem pontuou ainda.<br>Seja o primeiro a jogar!</p>';
          return;
        }
        container.innerHTML = lista.map((r, i) => `
          <div class="linha${i === 0 ? ' primeiro' : ''}">
            <span class="pos">${i + 1}&ordm;</span>
            <span class="nome">${escapar(r.jogador)}</span>
            <span class="pts">${r.pontos} pts</span>
          </div>`).join('');
      } catch (e) {
        container.innerHTML = '<p class="vazio">Servidor indisponivel.<br>Tentando novamente...</p>';
      }
    }

    function escapar(texto) {
      const div = document.createElement('div');
      div.textContent = texto;
      return div.innerHTML;
    }

    atualizar();
    setInterval(atualizar, 5000);
  </script>
</body>
</html>
